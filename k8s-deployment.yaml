apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-integration-service
  labels:
    app: country-integration-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: country-integration-service
  template:
    metadata:
      labels:
        app: country-integration-service
    spec:
      containers:
      - name: country-integration-service
        image: country-integration-service:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://host.docker.internal:3306/testdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: country-integration-service
spec:
  type: NodePort
  selector:
    app: country-integration-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8080
      nodePort: 30081
